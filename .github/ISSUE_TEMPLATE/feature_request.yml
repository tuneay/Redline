name: Feature request
description: Propose a focused improvement to Redline's core flow
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Redline intentionally keeps a narrow scope. Landing pages, authentication, accounts, payments, dashboards, databases, analytics, voice, web search, and unrelated integrations are not part of the current product.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve in the core interrogation or verdict flow?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain simpler approaches or workarounds you considered.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This directly strengthens or simplifies the five-question interrogation and verdict flow.
          required: true
        - label: This does not require an account, database, dashboard, payment system, analytics, or web search.
          required: true
